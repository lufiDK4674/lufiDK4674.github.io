name = "portfolio-chat-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# The OpenRouter API key is a secret. Set it with:
#   npx wrangler secret put OPENROUTER_API_KEY

[[ratelimits]]
name = "CHAT_RATE_LIMIT_MINUTE"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 15
  period = 60

[[ratelimits]]
name = "CHAT_RATE_LIMIT_GLOBAL_MINUTE"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "CONTACT_RATE_LIMIT"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 3
  period = 60

[vars]
EMAILJS_SERVICE_ID = "service_9xjccm4"
EMAILJS_TEMPLATE_ID = "template_cytbjeu"
EMAILJS_PUBLIC_KEY = "JPpzCKyX5fHr-cAYV"
